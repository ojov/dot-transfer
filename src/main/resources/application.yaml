spring:
  application:
    name: dottransfer
  data:
    jpa:
      repositories:
        enabled: on
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5437/dotdb
    username: dotuser
    password: dotpassword
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true