services:
  postgres:
    image: postgres:18
    container_name: dot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dotdb
      POSTGRES_USER: dotuser
      POSTGRES_PASSWORD: dotpassword
    ports:
      - "5437:5432"
    volumes:
      - dot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotuser -d dot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dot_postgres_data: